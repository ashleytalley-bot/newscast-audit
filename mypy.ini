# -----------------------------------------------------------------------------
# Mypy Configuration
# -----------------------------------------------------------------------------
# Defines strictness levels for static type checking.
# Used by ./check_types.sh
# -----------------------------------------------------------------------------

[mypy]
# Global Settings
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
# Ensure checks inside functions even if they lack type hints
check_untyped_defs = True

# STRICTNESS:
# We do NOT require every function to be typed (disallow_untyped_defs = False)
# BUT if you use types, we enforce correctness.
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Strict Optional: Forces you to use Optional[str] instead of str for None values
# This prevents many runtime "AttributeError: 'NoneType' object has no attribute..."
no_implicit_optional = True

# Helper warnings
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

# Ignore missing imports for libraries that don't have stubs or we don't need to check
[mypy-pytest.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-js.*]
ignore_missing_imports = True

[mypy-pyodide.*]
ignore_missing_imports = True

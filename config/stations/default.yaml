# TEGNA Default Station Configuration
# This is the baseline configuration for Eastern timezone stations.
# Copy this file and modify for other stations (e.g., central-time.yaml).

station:
  id: "tegna-default"
  name: "TEGNA Default (Eastern)"
  timezone: "America/New_York"

# Newscast timeslots in display order (earliest to latest)
# Each newscast has:
#   - id: unique identifier for internal use
#   - label: display name shown in UI and reports
#   - start_hour/end_hour: optional time bounds (24-hour format)
#   - is_streaming: true for non-broadcast shows
newscasts:
  - id: "early-morning"
    label: "5 - 7 am"
    start_hour: 5
    end_hour: 7

  - id: "morning"
    label: "7 - 9 am"
    start_hour: 7
    end_hour: 9

  - id: "midday"
    label: "12 pm"
    start_hour: 12
    end_hour: 13

  - id: "evening-5"
    label: "5 pm"
    start_hour: 17
    end_hour: 18

  - id: "evening-6"
    label: "6 pm"
    start_hour: 18
    end_hour: 19

  - id: "late"
    label: "11 pm"
    start_hour: 23
    end_hour: 24

  - id: "streaming"
    label: "E +"
    is_streaming: true

# Performance thresholds for color-coding
# Values >= good threshold: primary color (blue)
# Values <= poor threshold: alert color (red)
# Values in between: accent color (orange)
thresholds:
  good: 80
  poor: 40

# Color palette for charts and tables (TEGNA branding)
palette:
  primary: "#045ea8"      # Blue - good performance
  secondary: "#00458c"    # Dark blue - alternative
  accent: "#f36f21"       # Orange - moderate performance
  alert: "#d64541"        # Red - poor performance
  muted: "#6d6d6d"        # Gray - missing data
  bg_soft: "#dbe6f1"      # Light blue - backgrounds

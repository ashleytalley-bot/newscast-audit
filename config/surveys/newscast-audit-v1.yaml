# Newscast Quality Audit Survey Configuration v1
# This defines the column mappings and metrics for the MS Forms Excel export.
# When the survey changes, create a new version (e.g., newscast-audit-v2.yaml).

survey:
  id: "newscast-audit-v1"
  name: "Newscast Quality Audit"
  version: "1.0"
  description: "TEGNA newscast quality audit survey with 10 editorial metrics"

# Column mapping: Maps exact Excel column headers to internal names
# LEFT: Exact text from MS Forms Excel export (including trailing spaces)
# RIGHT: Snake_case internal name used in code
columns:
  # Metadata columns
  metadata:
    "Id": "id"
    "Start time": "start_time"
    "Completion time": "completion_time"
    "Email": "email"
    "Name": "name"
    "Additional comments below:": "additional_comments"

  # Key identifier columns
  identifiers:
    "Date of newscast:": "newscast_date"
    "Which newscast are you auditing?": "newscast"

# Metric definitions: The Yes/No audit questions we track
# Each metric has:
#   - excel_column: Exact column header from MS Forms export
#   - internal_name: Snake_case name used in code
#   - label: Human-readable display name for charts/tables
#   - type: Response type (yes_no, numeric, text)
#   - description: What this metric measures (optional)
metrics:
  - excel_column: "Does each story create urgency with time relevance and active writing explaining why stories are being told right now? "
    internal_name: "urgency_and_why_now"
    label: "Urgency and Why Now"
    type: "yes_no"
    description: "Stories create urgency with time relevance and active writing"

  - excel_column: "Is a tease to streaming in at least every 30 minutes with specific content push for each show?"
    internal_name: "specific_streaming_tease"
    label: "Streaming Tease Every 30min"
    type: "yes_no"
    description: "Tease to streaming at least every 30 minutes with specific content"

  - excel_column: "Did we use streaming content and/or mobile shorts in this show?"
    internal_name: "streaming_or_mobile_shorts"
    label: "Streaming/Mobile Shorts"
    type: "yes_no"
    description: "Used streaming content or mobile shorts in the show"

  - excel_column: "Are maps, timelines and supporting graphics used within 30 minutes for events and included as useful context in newscasts?"
    internal_name: "maps_graphics"
    label: "Maps and Graphics"
    type: "yes_no"
    description: "Maps, timelines, graphics used within 30 minutes with context"

  - excel_column: "Is there a clearly defined weather story, supported by graphics or video?"
    internal_name: "weather_story_defined"
    label: "Weather Story Defined"
    type: "yes_no"
    description: "Clear weather story supported by graphics or video"

  - excel_column: "Does each weather hit focus on new/now/next?"
    internal_name: "new_now_next"
    label: "Weather New/Now/Next"
    type: "yes_no"
    description: "Weather hits focus on new/now/next structure"

  - excel_column: "Does the story address the audience as \"you,\" end with \"Here's what you can do today\"?"
    internal_name: "address_audience_call_to_action"
    label: "Audience Call-to-Action"
    type: "yes_no"
    description: "Addresses audience as 'you' with actionable next steps"

  - excel_column: "Are anchors shown three times per show on tight shots with name supers?"
    internal_name: "three_tight_anchor_shots_with_supers"
    label: "Anchor Shots with Supers"
    type: "yes_no"
    description: "Three tight anchor shots per show with name graphics"

  - excel_column: "Did we specifically reference every piece of file or non-descript video?"
    internal_name: "reference_file_video"
    label: "Reference File Video"
    type: "yes_no"
    description: "Specific reference for file or non-descript video"

  - excel_column: "Do anchors add local context to two or more stories and include one community-celebration story per hour?"
    internal_name: "local_context"
    label: "Local Context"
    type: "yes_no"
    description: "Anchors add context to 2+ stories, 1 community story per hour"

# Response mappings for converting survey text to numeric values
response_mappings:
  yes_no:
    yes_values: ["yes", "y", "true", "1"]
    no_values: ["no", "n", "false", "0"]
    na_values: ["n/a", "na", "none", ""]

# Date parsing configuration
date_config:
  # Minimum valid year (filters out epoch/1970 bugs)
  min_valid_year: 2020
  # Date formats to try when parsing (in order)
  formats:
    - "%Y-%m-%d"
    - "%m/%d/%Y"
    - "%m-%d-%Y"
    - "%d/%m/%Y"

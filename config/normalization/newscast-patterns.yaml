# Newscast Name Normalization Patterns
# These patterns convert free-text newscast names to standardized labels.
#
# IMPORTANT: Pattern order matters! More specific patterns must come first.
# The normalizer tries patterns in order and returns the first match.
#
# Each pattern has:
#   - pattern: Python regex pattern (case-insensitive matching applied)
#   - output: Standardized newscast label
#   - description: Human-readable explanation
#   - test_cases: Example inputs that should match (for testing)

patterns:
  # Evening Plus variants (must come before generic evening patterns)
  - pattern: 'evening\s*\+|e\s*\+|evening\s+plus'
    output: "E +"
    description: "Evening Plus streaming show"
    test_cases:
      - "evening+"
      - "e+"
      - "E +"
      - "evening plus"
      - "Evening Plus"

  # Abbreviated AM ranges (5a-7a, 7a-9a) - MUST come before general AM patterns
  - pattern: '\b5\s*a\s*[-\u2013]\s*7\s*a\b'
    output: "5 - 7 am"
    description: "5a-7a abbreviated format"
    test_cases:
      - "5a-7a"
      - "5a - 7a"

  - pattern: '\b7\s*a\s*[-\u2013]\s*9\s*a\b'
    output: "7 - 9 am"
    description: "7a-9a abbreviated format"
    test_cases:
      - "7a-9a"
      - "7a - 9a"

  # "To" ranges (5 to 7am, 7 to 9am)
  - pattern: '5\s+to\s+7\s*(?:am|a\.m\.?)?'
    output: "5 - 7 am"
    description: "5 to 7 range format"
    test_cases:
      - "5 to 7"
      - "5 to 7am"
      - "5 to 7 am"
      - "5 to 7 a.m."

  - pattern: '7\s+to\s+[89]\s*(?:am|a\.m\.?)?'
    output: "7 - 9 am"
    description: "7 to 8/9 range format"
    test_cases:
      - "7 to 9"
      - "7 to 9am"
      - "7 to 8"
      - "7 to 8am"

  # Time ranges with full AM notation
  - pattern: '5\s*[-\u2013:]\s*7\s*(?:am|a\.m\.)'
    output: "5 - 7 am"
    description: "5-7am range with AM suffix"
    test_cases:
      - "5-7am"
      - "5-7 am"
      - "5:7am"
      - "5-7 a.m."

  - pattern: '7\s*[-\u2013:]\s*9\s*(?:am|a\.m\.)'
    output: "7 - 9 am"
    description: "7-9am range with AM suffix"
    test_cases:
      - "7-9am"
      - "7-9 am"
      - "7:9am"

  # PM shows (specific times) - use negative lookahead to avoid matching ranges
  - pattern: '\b11\s*(?:pm?|p\.m\.?)\b'
    output: "11 pm"
    description: "11 PM newscast"
    test_cases:
      - "11pm"
      - "11 pm"
      - "11p"
      - "11 p.m."

  - pattern: '\b11\b(?!\s*[-\u2013:])'
    output: "11 pm"
    description: "11 (assume PM)"
    test_cases:
      - "11"

  - pattern: '\b6\s*(?:pm?|p\.m\.?)\b(?!\s*[-\u2013:])'
    output: "6 pm"
    description: "6 PM newscast"
    test_cases:
      - "6pm"
      - "6 pm"
      - "6p"
      - "6 p.m."

  - pattern: '\b5\s*(?:pm?|p\.m\.?)\b(?!\s*[-\u2013:])'
    output: "5 pm"
    description: "5 PM newscast"
    test_cases:
      - "5pm"
      - "5 pm"
      - "5p"
      - "5 p.m."

  # Half-hour variations (customer request: 5:30 -> 5pm bucket)
  - pattern: '\b5:30\s*(?:pm?|p\.m\.?)?'
    output: "5 pm"
    description: "5:30 PM maps to 5 PM bucket"
    test_cases:
      - "5:30pm"
      - "5:30 pm"
      - "5:30"

  - pattern: '\b6:30\s*(?:pm?|p\.m\.?)?'
    output: "6 pm"
    description: "6:30 PM maps to 6 PM bucket"
    test_cases:
      - "6:30pm"
      - "6:30 pm"
      - "6:30"

  - pattern: '\b11:30\s*(?:pm?|p\.m\.?)?'
    output: "11 pm"
    description: "11:30 PM maps to 11 PM bucket"
    test_cases:
      - "11:30pm"
      - "11:30 pm"
      - "11:30"

  # Noon variations
  - pattern: '\b(?:noon|12\s*(?:pm?|p\.m\.?)|midday)\b'
    output: "12 pm"
    description: "Noon/12pm/midday newscast"
    test_cases:
      - "noon"
      - "Noon"
      - "12pm"
      - "12 pm"
      - "12 p.m."
      - "midday"

  - pattern: '\b12\b(?!\s*[-\u2013:])'
    output: "12 pm"
    description: "12 (assume noon)"
    test_cases:
      - "12"

  # Single AM times (map to ranges when used alone)
  - pattern: '\b5\s*(?:am|a\.m\.?)\b(?!\s*[-\u2013:])'
    output: "5 - 7 am"
    description: "5am alone maps to 5-7 range"
    test_cases:
      - "5am"
      - "5 am"
      - "5 a.m."

  - pattern: '\b7\s*(?:am|a\.m\.?)\b(?!\s*[-\u2013:])'
    output: "7 - 9 am"
    description: "7am alone maps to 7-9 range"
    test_cases:
      - "7am"
      - "7 am"
      - "7 a.m."

# Ambiguous patterns that should return null (not matched)
# These are inputs that look like they might be newscasts but are too vague
ambiguous_patterns:
  - pattern: '^\s*(?:am?|a\.m\.?)\s*$'
    reason: "Just 'am' without a time - ambiguous"
    test_cases:
      - "am"
      - "a"
      - "a.m."

  - pattern: '^\s*(?:pm?|p\.m\.?)\s*$'
    reason: "Just 'pm' without a time - ambiguous"
    test_cases:
      - "pm"
      - "p"
      - "p.m."

  - pattern: '^\s*morning\s*$'
    reason: "Generic 'morning' - unclear which show"
    test_cases:
      - "morning"
      - "Morning"

  - pattern: '^\s*evening\s*$'
    reason: "Generic 'evening' without '+' - use 'evening+' for Evening Plus"
    test_cases:
      - "evening"
      - "Evening"

  - pattern: '^\s*afternoon\s*$'
    reason: "Generic 'afternoon' - unclear which show"
    test_cases:
      - "afternoon"
      - "Afternoon"

# Configuration for the normalizer
normalizer_config:
  # If true, unknown formats pass through as-is (may cause sorting issues)
  # If false, unknown formats return null
  allow_unknown: true

  # If true, emit warnings for unknown formats
  warn_on_unknown: false
